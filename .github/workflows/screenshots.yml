name: App screenshots

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/scripts/screenshots.sh"
      - ".github/workflows/screenshots.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug app
        run: ./gradlew --no-daemon assembleDebug

      - name: Run on a virtual phone and take screenshots
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2   # 1080x1920, fits Google Play's screenshot size rules
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/screenshots.sh

      - uses: actions/upload-artifact@v7
        with:
          name: coinflip-screenshots
          path: screenshots/*.png
          if-no-files-found: error

      - name: Save screenshots into the repo (play-store/screenshots)
        run: |
          mkdir -p play-store/screenshots
          cp screenshots/*.png play-store/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play-store/screenshots
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update app screenshots [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
