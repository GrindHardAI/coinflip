name: Build release bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Signing secrets not set yet - building an UNSIGNED bundle (compile check only)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run unit tests
        run: ./gradlew --no-daemon test

      - name: Build app bundle
        env:
          KEYSTORE_FILE: ${{ steps.key.outputs.signed == 'true' && format('{0}/upload-keystore.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon bundleRelease

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.key.outputs.signed == 'true' && 'coinflip-release-aab' || 'coinflip-UNSIGNED-do-not-upload' }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
