name: Build release bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Signing secrets not set yet - building an UNSIGNED bundle (compile check only)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            # Strip any spaces/newlines that sneak in when pasting.
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/upload-keystore.jks" \
              || { echo "::error::KEYSTORE_BASE64 is not valid. Re-paste the whole of upload-keystore.base64.txt."; exit 1; }
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check signing secrets
        if: steps.key.outputs.signed == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          KS="$RUNNER_TEMP/upload-keystore.jks"
          PW="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \r\n\t')"
          AL="$(printf '%s' "$KEY_ALIAS" | tr -d ' \r\n\t')"
          echo "Keystore file: $(wc -c < "$KS") bytes, sha256 starts $(sha256sum "$KS" | cut -c1-16) (expected 0f7b2085a9ff534b)"
          echo "Password length: ${#PW} characters (expected 24)"
          if [ "$(sha256sum "$KS" | cut -c1-16)" != "0f7b2085a9ff534b" ]; then
            echo "::error::KEYSTORE_BASE64 secret is wrong or incomplete. Re-paste ALL of upload-keystore.base64.txt."; exit 1
          fi
          if ! keytool -list -keystore "$KS" -storepass "$PW" >/dev/null 2>&1; then
            echo "::error::KEYSTORE_PASSWORD secret is wrong. Paste only the 24-character password from SIGNING-SECRETS.txt."; exit 1
          fi
          if ! keytool -list -keystore "$KS" -storepass "$PW" -alias "$AL" >/dev/null 2>&1; then
            echo "::error::KEY_ALIAS secret is wrong. It should be exactly: upload"; exit 1
          fi
          echo "Signing secrets look correct."
          fi

      - name: Run unit tests
        run: ./gradlew --no-daemon test

      - name: Build app bundle
        env:
          KEYSTORE_FILE: ${{ steps.key.outputs.signed == 'true' && format('{0}/upload-keystore.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon bundleRelease

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.key.outputs.signed == 'true' && 'coinflip-release-aab' || 'coinflip-UNSIGNED-do-not-upload' }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
